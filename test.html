<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Тесты SaveTube</title>
    <style>
        body { font-family: monospace; padding: 20px; background: #1a1512; color: #fdfbf7; }
        .pass { color: #4ade80; }
        .fail { color: #f87171; }
        .test-block { margin-bottom: 15px; padding: 10px; border: 1px solid #4a3728; border-radius: 8px; }
        h2 { color: #b45309; }
    </style>
</head>
<body>
    <h1>🧪 Тесты MVP SaveTube</h1>
    <div id="results"></div>

    <script>
        const resultsDiv = document.getElementById('results');
        let passed = 0;
        let failed = 0;

        function assert(condition, testName) {
            const div = document.createElement('div');
            div.className = 'test-block';
            if (condition) {
                div.innerHTML = `<span class="pass">✅ PASS:</span> ${testName}`;
                passed++;
            } else {
                div.innerHTML = `<span class="fail">❌ FAIL:</span> ${testName}`;
                failed++;
            }
            resultsDiv.appendChild(div);
        }

        // ==========================================
        // 1. ТЕСТ: Валидация ссылки (Функциональное требование)
        // ==========================================
        function isValidUrl(url) {
            return url && (url.includes('youtube.com') || url.includes('youtu.be'));
        }

        assert(isValidUrl('https://www.youtube.com/watch?v=123'), 'Валидация: корректная ссылка youtube.com');
        assert(isValidUrl('https://youtu.be/123'), 'Валидация: корректная ссылка youtu.be');
        assert(!isValidUrl('https://google.com'), 'Валидация: отклонение неверной ссылки');
        assert(!isValidUrl(''), 'Валидация: отклонение пустой строки');

        // ==========================================
        // 2. ТЕСТ: Лимит длительности (2 часа)
        // ==========================================
        function isDurationAllowed(durationInSeconds) {
            return durationInSeconds <= 7200;
        }

        assert(isDurationAllowed(3600), 'Лимит: видео на 1 час разрешено');
        assert(!isDurationAllowed(7300), 'Лимит: видео на 2 часа 1 минуту запрещено');

        // ==========================================
        // 3. ТЕСТ: Очистка имени файла (Безопасность)
        // ==========================================
        function sanitizeFileName(name) {
            return name.replace(/[\\/:*?"<>|]/g, '_').trim().substring(0, 100);
        }

        assert(sanitizeFileName('Моя песня: хит?') === 'Моя песня_ хит_', 'Безопасность: замена запрещенных символов');
        assert(sanitizeFileName('a'.repeat(150)).length === 100, 'Безопасность: обрезка длинного имени до 100 символов');

        // ==========================================
        // 4. ТЕСТ: Лимит размера файла (100 МБ)
        // ==========================================
        function isSizeAllowed(sizeInBytes) {
            return sizeInBytes <= 100 * 1024 * 1024;
        }

        assert(isSizeAllowed(50 * 1024 * 1024), 'Размер: файл 50 МБ разрешен');
        assert(!isSizeAllowed(101 * 1024 * 1024), 'Размер: файл 101 МБ запрещен');

        // ==========================================
        // 5. ТЕСТ: Парсинг ID видео (для обложки)
        // ==========================================
        function getVideoId(url) {
            if (!url) return null;
            if (url.includes('youtu.be/')) return url.split('youtu.be/')[1]?.split('?')[0];
            if (url.includes('v=')) return url.split('v=')[1]?.split('&')[0];
            return null;
        }

        assert(getVideoId('https://youtu.be/dQw4w9WgXcQ') === 'dQw4w9WgXcQ', 'Парсинг: ID из youtu.be');
        assert(getVideoId('https://youtube.com/watch?v=dQw4w9WgXcQ&t=10') === 'dQw4w9WgXcQ', 'Парсинг: ID из youtube.com');

        // ==========================================
        // ИТОГ
        // ==========================================
        const summary = document.createElement('h2');
        summary.innerHTML = `Итого: <span class="pass">${passed} пройдено</span>, <span class="fail">${failed} провалено</span>`;
        resultsDiv.appendChild(summary);

        if (failed > 0) {
            alert('Есть проваленные тесты! Исправьте код.');
        }
    </script>
</body>
</html>
